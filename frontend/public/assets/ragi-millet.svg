<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ragiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C41E3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
    <pattern id="ragiPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#FFF" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#ragiGradient)"/>
  <rect width="200" height="200" fill="url(#ragiPattern)"/>
  <g transform="translate(100, 100)">
    <circle cx="0" cy="-30" r="8" fill="#FFD700"/>
    <circle cx="20" cy="-20" r="7" fill="#FFA500"/>
    <circle cx="25" cy="5" r="8" fill="#FF8C00"/>
    <circle cx="15" cy="25" r="7" fill="#FFD700"/>
    <circle cx="-10" cy="30" r="8" fill="#FFA500"/>
    <circle cx="-25" cy="15" r="7" fill="#FFD700"/>
    <circle cx="-30" cy="-5" r="8" fill="#FF8C00"/>
    <circle cx="-20" cy="-25" r="7" fill="#FFA500"/>
  </g>
  <text x="100" y="180" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Finger Millet</text>
</svg>